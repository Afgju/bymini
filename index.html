<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تعديل صور بالذكاء الاصطناعي</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
    background: #0f0f0f;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 6px;
    background: linear-gradient(90deg, #f5a623, #f76b1c);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 20px; }

  .upload-area {
    width: 100%;
    max-width: 480px;
    border: 2px dashed #444;
    border-radius: 14px;
    padding: 30px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s;
    margin-bottom: 16px;
  }
  .upload-area:hover { border-color: #f5a623; }
  .upload-area input { display: none; }
  .upload-icon { font-size: 2.5rem; margin-bottom: 8px; }
  .upload-text { color: #aaa; font-size: 0.9rem; }

  .images-row {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 16px;
  }
  .img-box {
    flex: 1;
    background: #1a1a1a;
    border-radius: 12px;
    overflow: hidden;
    display: none;
  }
  .img-box img { width: 100%; display: block; }
  .img-label {
    text-align: center;
    font-size: 0.75rem;
    color: #888;
    padding: 6px;
  }

  .btn {
    width: 100%;
    max-width: 480px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 12px;
    transition: opacity 0.2s, transform 0.1s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    background: linear-gradient(135deg, #f5a623, #f76b1c);
    color: #fff;
  }
  .btn-download {
    background: #1e7e34;
    color: #fff;
    display: none;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .status {
    width: 100%;
    max-width: 480px;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 0.85rem;
    color: #ccc;
    min-height: 52px;
    display: none;
    margin-bottom: 12px;
    line-height: 1.6;
  }
  .status.show { display: block; }
  .status.error { color: #ff6b6b; border: 1px solid #ff3333; }
  .status.success { color: #6bffb8; }

  .analysis-box {
    width: 100%;
    max-width: 480px;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 0.82rem;
    color: #bbb;
    display: none;
    margin-bottom: 12px;
    border-right: 3px solid #f5a623;
    line-height: 1.7;
  }
  .analysis-box.show { display: block; }
  .analysis-title { color: #f5a623; font-weight: 700; margin-bottom: 6px; font-size: 0.9rem; }

  .params-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .param-item {
    background: #252525;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 0.78rem;
  }
  .param-name { color: #888; }
  .param-val { color: #f5a623; font-weight: 700; }

  .spinner {
    display: inline-block;
    width: 16px; height: 16px;
    border: 2px solid #ffffff44;
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-left: 8px;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>✨ تعديل صور بالذكاء الاصطناعي</h1>
<p class="subtitle">ارفع صورتك وسيحللها الذكاء الاصطناعي ويعدلها تلقائياً</p>

<div class="upload-area" onclick="document.getElementById('fileInput').click()">
  <input type="file" id="fileInput" accept="image/*">
  <div class="upload-icon">🖼️</div>
  <div class="upload-text">اضغط لرفع الصورة</div>
</div>

<div class="images-row">
  <div class="img-box" id="originalBox">
    <img id="originalImg" />
    <div class="img-label">الأصلية</div>
  </div>
  <div class="img-box" id="editedBox">
    <img id="editedImg" />
    <div class="img-label">بعد التعديل</div>
  </div>
</div>

<button class="btn btn-primary" id="analyzeBtn" disabled onclick="analyzeAndEdit()">
  🤖 حلل وعدّل بالذكاء الاصطناعي
</button>

<div class="status" id="status"></div>
<div class="analysis-box" id="analysisBox"></div>

<button class="btn btn-download" id="downloadBtn" onclick="downloadImage()">
  ⬇️ تحميل الصورة المعدلة
</button>

<canvas id="canvas" style="display:none"></canvas>

<script>
let originalImageData = null;
let editedDataUrl = null;

document.getElementById('fileInput').addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    originalImageData = ev.target.result;
    document.getElementById('originalImg').src = originalImageData;
    document.getElementById('originalBox').style.display = 'block';
    document.getElementById('editedBox').style.display = 'none';
    document.getElementById('analyzeBtn').disabled = false;
    document.getElementById('downloadBtn').style.display = 'none';
    document.getElementById('analysisBox').className = 'analysis-box';
    setStatus('');
  };
  reader.readAsDataURL(file);
});

function setStatus(msg, type='') {
  const el = document.getElementById('status');
  if (!msg) { el.className = 'status'; return; }
  el.className = 'status show ' + type;
  el.innerHTML = msg;
}

async function analyzeAndEdit() {
  if (!originalImageData) return;

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = '🤖 الذكاء الاصطناعي يحلل الصورة... <span class="spinner"></span>';
  document.getElementById('downloadBtn').style.display = 'none';
  setStatus('⏳ جاري إرسال الصورة للذكاء الاصطناعي للتحليل...');

  // Extract base64
  const base64Data = originalImageData.split(',')[1];
  const mimeType = originalImageData.split(';')[0].split(':')[1];

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        messages: [{
          role: "user",
          content: [
            {
              type: "image",
              source: { type: "base64", media_type: mimeType, data: base64Data }
            },
            {
              type: "text",
              text: `أنت خبير تعديل صور محترف. حلل هذه الصورة بدقة واعطني تعليمات تعديل محددة بالأرقام.

أجب فقط بـ JSON بدون أي نص آخر:
{
  "analysis": "وصف مختصر للمشكلات بالعربي",
  "brightness": 1.0,
  "contrast": 1.0,
  "saturation": 1.0,
  "shadows_lift": 0,
  "highlights_pull": 0,
  "warm_r": 1.0,
  "warm_g": 1.0,
  "warm_b": 1.0,
  "sharpness": 0
}

قيم brightness/contrast/saturation: من 0.7 إلى 1.5
shadows_lift: رفع الظلال 0-60 (إضافة إلى الأماكن الداكنة)
highlights_pull: تخفيف الإضاءة 0-40 (يُطرح من الأماكن المضيئة)
warm_r/g/b: درجة حرارة اللون 0.88-1.12
sharpness: حدة الصورة 0-2 (0=بدون تغيير)`
            }
          ]
        }]
      })
    });

    const data = await response.json();
    const text = data.content.filter(b => b.type === 'text').map(b => b.text).join('');
    
    // Parse JSON from response
    const jsonMatch = text.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('لم يتمكن الذكاء الاصطناعي من تحليل الصورة');
    
    const params = JSON.parse(jsonMatch[0]);
    
    setStatus('✅ تم التحليل! جاري تطبيق التعديلات...', 'success');
    showAnalysis(params);
    
    await new Promise(r => setTimeout(r, 300));
    applyEdits(params);

  } catch(err) {
    setStatus('❌ خطأ: ' + err.message, 'error');
    btn.disabled = false;
    btn.innerHTML = '🤖 حلل وعدّل بالذكاء الاصطناعي';
  }
}

function showAnalysis(params) {
  const box = document.getElementById('analysisBox');
  box.className = 'analysis-box show';
  box.innerHTML = `
    <div class="analysis-title">🔍 تحليل الذكاء الاصطناعي</div>
    <div style="margin-bottom:10px">${params.analysis}</div>
    <div class="params-grid">
      <div class="param-item"><span class="param-name">الإضاءة </span><span class="param-val">${params.brightness}x</span></div>
      <div class="param-item"><span class="param-name">الكونتراست </span><span class="param-val">${params.contrast}x</span></div>
      <div class="param-item"><span class="param-name">التشبع </span><span class="param-val">${params.saturation}x</span></div>
      <div class="param-item"><span class="param-name">الظلال </span><span class="param-val">+${params.shadows_lift}</span></div>
      <div class="param-item"><span class="param-name">الإضاءة العالية </span><span class="param-val">-${params.highlights_pull}</span></div>
      <div class="param-item"><span class="param-name">الحدة </span><span class="param-val">${params.sharpness}</span></div>
    </div>
  `;
}

function applyEdits(params) {
  const img = new Image();
  img.onload = function() {
    const canvas = document.getElementById('canvas');
    canvas.width = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = imageData.data;

    const brightness = params.brightness || 1.0;
    const contrast = params.contrast || 1.0;
    const saturation = params.saturation || 1.0;
    const shadowsLift = params.shadows_lift || 0;
    const highlightsPull = params.highlights_pull || 0;
    const warmR = params.warm_r || 1.0;
    const warmG = params.warm_g || 1.0;
    const warmB = params.warm_b || 1.0;
    const sharpness = params.sharpness || 0;

    for (let i = 0; i < d.length; i += 4) {
      let r = d[i], g = d[i+1], b = d[i+2];

      // Warm tone
      r = Math.min(255, r * warmR);
      g = Math.min(255, g * warmG);
      b = Math.min(255, b * warmB);

      // Brightness
      r = r * brightness; g = g * brightness; b = b * brightness;

      // Shadows lift
      const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
      if (shadowsLift > 0) {
        const shadowMask = Math.max(0, 1 - lum) ** 1.5;
        r += shadowsLift * shadowMask;
        g += shadowsLift * shadowMask;
        b += shadowsLift * shadowMask;
      }

      // Highlights pull
      if (highlightsPull > 0) {
        const hiMask = Math.max(0, lum - 0.75) * 4;
        r -= highlightsPull * hiMask;
        g -= highlightsPull * hiMask;
        b -= highlightsPull * hiMask;
      }

      // Contrast
      r = (r - 128) * contrast + 128;
      g = (g - 128) * contrast + 128;
      b = (b - 128) * contrast + 128;

      // Saturation
      const gray = r * 0.299 + g * 0.587 + b * 0.114;
      r = gray + (r - gray) * saturation;
      g = gray + (g - gray) * saturation;
      b = gray + (b - gray) * saturation;

      d[i]   = Math.max(0, Math.min(255, r));
      d[i+1] = Math.max(0, Math.min(255, g));
      d[i+2] = Math.max(0, Math.min(255, b));
    }

    ctx.putImageData(imageData, 0, 0);

    // Sharpness via unsharp mask (simple)
    if (sharpness > 0) {
      ctx.filter = `contrast(${1 + sharpness * 0.05})`;
      ctx.drawImage(canvas, 0, 0);
      ctx.filter = 'none';
    }

    editedDataUrl = canvas.toDataURL('image/jpeg', 0.97);
    document.getElementById('editedImg').src = editedDataUrl;
    document.getElementById('editedBox').style.display = 'block';
    document.getElementById('downloadBtn').style.display = 'block';

    setStatus('🎉 تم التعديل بنجاح بواسطة الذكاء الاصطناعي!', 'success');

    const btn = document.getElementById('analyzeBtn');
    btn.disabled = false;
    btn.innerHTML = '🤖 حلل وعدّل بالذكاء الاصطناعي';
  };
  img.src = originalImageData;
}

function downloadImage() {
  if (!editedDataUrl) return;
  const a = document.createElement('a');
  a.href = editedDataUrl;
  a.download = 'ai_edited_photo.jpg';
  a.click();
}
</script>
</body>
</html>
